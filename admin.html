<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sotuvchi Kabineti | LimonSavdo</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <!-- Login Section -->
    <div id="loginSection" class="container">
        <div class="login-container">
            <h2 style="margin-bottom: 20px;">Tizimga Kirish</h2>
            <div class="login-form">
                <input type="password" id="adminPassword" placeholder="Parolni kiriting">
                <button class="btn btn-primary" style="width: 100%" onclick="adminLogin()">Kirish</button>
            </div>
        </div>
    </div>

    <!-- Dashboard Section (Hidden by default) -->
    <div id="dashboardSection" style="display: none;">
        <header class="admin-header">
            <div class="container admin-nav">
                <h2><i class="fa-solid fa-lemon"></i> Sotuvchi Kabineti</h2>
                <button class="btn btn-sm" style="width: auto; margin:0;" onclick="logout()">Chiqish</button>
            </div>
        </header>

        <div class="container">
            <div class="dashboard-grid">
                <!-- Add Product Card -->
                <div class="upload-card">
                    <h3 style="margin-bottom: 20px;">Yangi Limon Ko'chati Qo'shish</h3>

                    <div class="form-group">
                        <label>Rasm Yuklash</label>
                        <div class="image-preview" id="imagePreview"
                            onclick="document.getElementById('productImage').click()" style="cursor: pointer;">
                            <i class="fa-solid fa-cloud-arrow-up"></i>
                        </div>
                        <input type="file" id="productImage" accept="image/*" style="display: none"
                            onchange="previewImage(this)">
                    </div>

                    <div class="form-group">
                        <label>Mahsulot Nomi</label>
                        <input type="text" id="productName" placeholder="Masalan: 2 yillik hosildor ko'chat">
                    </div>

                    <div class="form-group">
                        <label>Tavsif va Holati</label>
                        <textarea id="productDesc" rows="4"
                            placeholder="Ko'chatning holati, bo'yi, yoshi va afzalliklari haqida yozing..."></textarea>
                    </div>

                    <div class="form-group">
                        <label>Narxi (ixtiyoriy, mijozga ko'rinmaydi, faqat ma'lumot uchun)</label>
                        <input type="text" id="productPrice" placeholder="Narx">
                    </div>

                    <button class="btn btn-primary" onclick="addProduct()">E'lonni Joylash</button>
                </div>

                <!-- Product List -->
                <div class="upload-card">
                    <h3 style="margin-bottom: 20px;">Mening E'lonlarim</h3>
                    <div id="adminProductList" class="products-grid">
                        <!-- Products will appear here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Check if already logged in
        if (localStorage.getItem('isAdmin') === 'true') {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('dashboardSection').style.display = 'block';
            loadAdminProducts();
        }
    </script>
</body>

</html>
